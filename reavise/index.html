<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REAVISE: hearing a voice through the noise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Caveat:wght@500..700&amp;display=swap">
<style>
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --line:#D5DCE6; --ink:#131C2E; --body:#3F4A5E; --muted:#5A6578;
  --blue:#1F5FD0; --orange:#F08A24; --orange-t:#A84E0B; --rose:#D1486A; --rose-t:#A92F50;
  --film:#0C1322; --lblue:#9CC4FF; --lorange:#FFB366; --soft:#C5CFDF; --band:#E1ECFC;
  --sans:'Bricolage Grotesque',system-ui,'Segoe UI',Arial,sans-serif;
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--film);overflow:hidden}
body{font-family:var(--sans);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--rose);outline-offset:3px}

/* ---------- stage and slides */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:88px 120px 112px;background:var(--bg)}
.slide.active{display:flex}
.slide.dark{background:var(--ink);color:#F6F8FB}
h1{font-weight:650;font-size:78px;line-height:1.05;letter-spacing:-.02em}
h1.big{font-size:112px;line-height:1}
h2{font-weight:650;font-size:42px;line-height:1.1;letter-spacing:-.01em}
.step{font-weight:700;font-size:32px;color:var(--blue);margin-bottom:10px}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:40px;padding-top:30px}
.cap{font-size:38px;line-height:1.3;color:var(--body)}
.cap b{color:var(--ink);font-weight:700}
.dark .cap{color:var(--soft)} .dark .cap b{color:#fff}
.center{text-align:center}
.hand{font-family:var(--hand);font-weight:600;font-size:48px;line-height:1.02}
.hand.b{color:var(--blue)} .hand.o{color:var(--orange-t)} .hand.r{color:var(--rose-t)} .hand.l{color:var(--lblue)}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px}
.row{display:flex}
.nw{white-space:nowrap}
.pill{display:inline-block;white-space:nowrap;font-weight:600;font-size:27px;line-height:1;padding:14px 22px;border-radius:40px;background:var(--bg);border:2px solid var(--line);color:var(--body)}
svg{display:block}
svg text{font-family:var(--sans)}

/* ---------- video tile: a film frame with a play symbol and a running timeline */
.vid{position:relative;background:var(--film);border-radius:24px;padding:26px 14px}
.vid::before,.vid::after,.film::before,.film::after{content:"";position:absolute;left:20px;right:20px;height:9px;border-radius:2px;opacity:.85;
  background:repeating-linear-gradient(90deg,#EEF2F7 0 13px,transparent 13px 31px)}
.vid::before{top:9px} .vid::after{bottom:9px}
.vid.sm{padding:17px 8px;border-radius:16px}
.vid.sm::before,.vid.sm::after{height:6px;left:12px;right:12px;background:repeating-linear-gradient(90deg,#EEF2F7 0 8px,transparent 8px 20px)}
.vid.sm::before{top:6px} .vid.sm::after{bottom:6px}
.screen{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#FFF3E4}
.screen>svg,.screen>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.screen>video{display:none;background:#000}
.screen.has>video{display:block}
.vbadge,.vmute{position:absolute;top:12px;width:54px;height:54px;border-radius:50%;background:rgba(12,19,34,.82);color:#fff;display:grid;place-items:center}
.vbadge{left:12px} .vmute{right:12px}
.vbadge svg,.vmute svg{width:32px;height:32px}
.sm .vbadge{width:36px;height:36px;top:8px;left:8px} .sm .vbadge svg{width:22px;height:22px}
.scrub{position:absolute;left:12px;right:12px;bottom:12px;height:8px;border-radius:4px;background:rgba(12,19,34,.28)}
.scrub i{display:block;height:100%;width:0;border-radius:4px;background:var(--rose)}
.sm .scrub{height:5px;left:8px;right:8px;bottom:8px}
.vadd{position:absolute;right:12px;bottom:30px;width:44px;height:44px;border-radius:50%;border:2px dashed rgba(12,19,34,.55);background:rgba(255,255,255,.7);color:var(--ink);display:grid;place-items:center;opacity:.55}
.vadd:hover{opacity:1} .vadd svg{width:24px;height:24px}
.screen.has .vadd{display:none}

/* ---------- film strip: one continuous clip, not separate pictures */
.film{position:relative;display:flex;gap:3px;background:var(--film);border-radius:12px;padding:17px 9px;width:100%}
.film::before,.film::after{left:11px;right:11px;height:6px;background:repeating-linear-gradient(90deg,#EEF2F7 0 9px,transparent 9px 22px)}
.film::before{top:6px} .film::after{bottom:6px}
.film svg{flex:1;width:0;min-width:0;height:100%;border-radius:3px}
.nofilm{width:100%;height:100%;border:3px dashed #9AA5B8;border-radius:12px;display:grid;place-items:center;color:#7E8AA0;font-family:var(--hand);font-weight:600;font-size:44px}
.nofilm svg{width:46px;height:46px}

/* ---------- timeline with tracks and a moving playhead */
.tl{display:flex;gap:16px}
.tll{display:flex;flex-direction:column;width:64px;flex:none}
.tlc{display:grid;place-items:center}
.tico{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.tico svg{width:32px;height:32px}
.tlt{position:relative;display:flex;flex-direction:column;flex:1;min-width:0}
.tlr{position:relative;z-index:1}
.band{position:absolute;bottom:0;background:var(--band);border-radius:14px;z-index:0}
.trk{position:relative}
.playhead{position:absolute;top:-10px;bottom:-10px;left:0;width:5px;margin-left:-2.5px;border-radius:3px;background:var(--rose);z-index:3;pointer-events:none}
.playhead::before{content:"";position:absolute;left:-8.5px;top:-6px;border:11px solid transparent;border-top:14px solid var(--rose);border-bottom:0}

/* ---------- play buttons for your own sounds */
.chip{display:inline-flex;align-items:center;gap:12px;height:60px;padding:0 24px 0 8px;border-radius:30px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:650;font-size:26px;flex:none}
.chip .ico{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.chip .ico svg{width:28px;height:28px}
.chip.mini{width:56px;height:56px;padding:0;justify-content:center;gap:0}
.chip.mini .ico{width:40px;height:40px}
.chip.empty{background:transparent;border:2px dashed #9AA5B8;color:var(--muted)}
.chip.empty .ico{background:transparent;color:#7E8AA0}
.chip.playing{background:var(--rose);border-color:var(--rose)}
.chip.light{border-color:#fff;background:#fff;color:var(--ink)}
.chip.light .ico{background:var(--ink);color:#fff}
.chip.light.empty{background:transparent;border:2px dashed #7C89A3;color:var(--soft)}
.chip.light.empty .ico{background:transparent;color:var(--soft)}

/* ---------- big before/after players */
.player{position:relative;width:816px;height:470px;border-radius:26px;overflow:hidden;background:var(--film)}
.player video{position:absolute;inset:0;width:100%;height:100%;background:var(--film)}
.player .pwave{position:absolute;left:28px;right:28px;top:60px;display:none}
.player.audio .pwave{display:block}
.player.audio video{top:auto;height:86px;background:transparent}
.player .dico svg{width:84px;height:84px} .xscreen .dico svg{width:64px;height:64px}
.player.empty video{display:none}

/* ---------- real examples: rows that play your files, and a screen for the input video */
.runs{display:flex;flex-direction:column;gap:16px;justify-content:center}
.run{display:flex;align-items:center;gap:18px;width:100%;height:92px;padding:0 28px 0 14px;border-radius:46px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:650;font-size:32px;text-align:left;white-space:nowrap}
.run .ico{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.run .ico svg{width:38px;height:38px}
.run .rp{flex:1;min-width:30px;height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.run .rp i{display:block;height:100%;width:0;background:var(--lblue)}
.run.alt{background:#fff;color:var(--ink)}
.run.alt .ico{background:var(--ink);color:#fff}
.run.alt .rp{background:var(--line)} .run.alt .rp i{background:var(--blue)}
.run.empty{background:transparent;border:2px dashed #9AA5B8;color:var(--muted)}
.run.empty .ico{background:transparent;color:#7E8AA0}
.run.empty .rp{visibility:hidden}
.run.playing{background:var(--rose);border-color:var(--rose);color:#fff}
.run.playing .ico{background:#fff;color:var(--rose-t)}
.run.playing .rp{background:rgba(255,255,255,.3)} .run.playing .rp i{background:#fff}
.xscreen{position:relative;width:560px;height:420px;flex:none;border-radius:22px;overflow:hidden;background:var(--film)}
.xscreen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--film)}
.xscreen.empty video{display:none}
.xscreen video{cursor:pointer}
.xplay{position:absolute;left:50%;top:50%;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:4px solid #fff;background:rgba(12,19,34,.72);color:#fff;display:grid;place-items:center;transition:opacity .15s}
.xplay svg{width:68px;height:68px}
.xscreen.on .xplay{opacity:0}
.xscreen.on:hover .xplay,.xscreen .xplay:focus-visible{opacity:.92}
.xbar{position:absolute;left:14px;right:14px;bottom:12px;height:8px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.xbar i{display:block;height:100%;width:0;background:var(--rose)}
.xchg{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;border:2px dashed rgba(255,255,255,.75);background:rgba(12,19,34,.6);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.xchg svg{width:26px;height:26px}
.xscreen:hover .xchg,.xscreen .xchg:focus-visible{opacity:.92}
.xscreen.empty .xplay,.xscreen.empty .xbar,.xscreen.empty .xchg{display:none}
.xwarn{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:14px;padding:70px 34px 34px;color:var(--soft);font-size:24px;line-height:1.3;background:var(--film)}
.xwarn b{font-size:30px;font-weight:650;color:#fff}
.xwarn code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;color:var(--lblue);background:rgba(255,255,255,.08);padding:10px 12px;border-radius:8px;user-select:all}
.xscreen.nopic .xwarn{display:flex}
.xscreen.nopic .xplay,.xscreen.nopic .xbar{display:none}
.xscreen.nopic .xchg{opacity:.92;z-index:2}
.xtag{position:absolute;left:14px;top:14px;display:none;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:22px;background:rgba(12,19,34,.82);color:#fff;font-weight:650;font-size:22px}
.xtag svg{width:26px;height:26px}
.xscreen:not(.empty) .xtag{display:flex}
.rhead{font-family:var(--hand);font-weight:600;font-size:40px;line-height:1;color:var(--muted)}
.rhead.ref{color:var(--blue)}
.rhead.gap{margin-top:22px}
.novid{height:150px;flex:none}
.novid .nofilm span{display:flex;align-items:center;gap:16px}
.run.alt{border-color:var(--blue)}
.tnum{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:650;font-size:24px;color:var(--muted)}

/* ---------- slide-specific layout */
.eq{display:flex;gap:20px;align-items:stretch}
.tile{width:480px;padding:28px;display:flex;flex-direction:column;gap:20px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.op{width:80px;display:grid;place-items:center;font-weight:500;font-size:88px;color:var(--muted)}
.scenes{display:flex;gap:28px}
.scene{flex:1;padding:24px;display:flex;flex-direction:column;gap:20px;align-items:center}
.pic{position:relative;width:100%}
.pic svg{width:100%;height:auto}
.rec{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:20px;background:rgba(12,19,34,.86);color:#fff}
.rec i{width:13px;height:13px;border-radius:50%;background:#FF4D6D}
.rec svg{width:26px;height:26px}
.dia{position:relative;flex:none}
.side{flex:1;display:flex;flex-direction:column;gap:34px}
.panel{flex:1;min-width:0;padding:36px;display:flex;flex-direction:column;gap:22px}
.words{display:flex;gap:19px}
.words>div{display:flex;flex-direction:column;align-items:center;gap:10px}
.words em{font-style:italic;font-weight:650;font-size:44px}
.pills{display:flex;flex-wrap:wrap;gap:12px}
.chain{display:flex;gap:26px;align-items:center;justify-content:center}
.chain>.col{display:flex;flex-direction:column;gap:16px;align-items:center}
.model{padding:28px 30px;display:flex;flex-direction:column;gap:18px;align-items:center}
.prog{width:100%;height:8px;border-radius:4px;background:var(--line)}
.prog i{display:block;height:100%;width:0;border-radius:4px;background:var(--blue)}
.ins{width:600px;display:flex;flex-direction:column;gap:22px;flex:none}
.in{padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.note{font-size:26px;color:var(--muted)}
.out{background:var(--ink);border-radius:28px;padding:32px 36px;display:flex;flex-direction:column;gap:14px;color:#fff}
.knobrow{display:flex;justify-content:space-between}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--orange));margin-top:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:52px;border-radius:50%;background:#fff;border:6px solid var(--ink);cursor:grab}
input[type=range]::-moz-range-thumb{width:42px;height:42px;border-radius:50%;background:#fff;border:6px solid var(--ink);cursor:grab}
.ba{display:flex;gap:48px;justify-content:center}
.ba>div{display:flex;flex-direction:column;gap:14px}
.why{display:flex;gap:28px}
.why>div{flex:1;padding:44px 40px;display:flex;flex-direction:column;gap:20px}
.why .wico{width:104px;height:104px;border-radius:50%;background:var(--band);color:var(--blue);display:grid;place-items:center}
.why .wico svg{width:60px;height:60px}
.why h2{font-size:58px}
.box{position:absolute;border-radius:28px;background:#fff;border:4px solid var(--blue);padding:26px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}
.tag{font-weight:650;font-size:24px;white-space:nowrap;padding:11px 18px;border-radius:30px;color:#fff}

/* ---------- controls */
#ui{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:15px;color:#C5CFDF;opacity:.5;transition:opacity .2s;z-index:20}
#ui:hover,#ui:focus-within{opacity:1}
#ui button{background:rgba(12,19,34,.85);border:1px solid #44506A;color:#fff;border-radius:8px;padding:6px 12px;font-size:15px}
#dots{display:flex;gap:7px}
#dots i{width:9px;height:9px;border-radius:50%;background:#7C89A3;cursor:pointer}
#dots i.on{background:#fff;transform:scale(1.35)}
#nav{display:flex;gap:8px;align-items:center}
/* Website links use the presentation's navigation styling. */
#ui{flex-wrap:wrap;gap:8px}
#ui a{background:rgba(12,19,34,.85);border:1px solid #44506A;color:#fff;border-radius:8px;padding:6px 12px;font-size:15px;text-decoration:none}
#ui a:focus-visible{outline:4px solid var(--rose);outline-offset:3px}
@media(max-width:900px){#dots{order:3;flex-basis:100%;justify-content:center}#ui button,#ui a{font-size:12px;padding:5px 8px}}
.chip:disabled,.run:disabled{cursor:default;opacity:.55}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><a href="/projects/">Projects</a><a href="fr/" hreflang="fr" lang="fr">Français</a></div>
  <div id="dots"></div>
  <div id="nav"><span id="count"></span><button id="bPrev" aria-label="Previous slide">‹</button><button id="bNext" aria-label="Next slide">›</button><button id="bFull" title="Full screen (F)">Full screen</button></div>
</div>

<script>
// Shared assets extracted from the original saved presentation.
const MEDIA_FILES={
  "demo_before": "demo_before.mp4",
  "demo_after": "demo_after.mp4",
  "silent": "silent.mp4",
  "reference": "reference.wav",
  "synced_1": "synced_1.wav",
  "synced_2": "synced_2.wav",
  "random_1": "random_1.wav",
  "random_2": "random_2.wav",
  "clean": "clean.wav",
  "noise": "noise.wav",
  "noisy": "noisy.wav"
};
/* Media is loaded from the shared static folder; this is a public viewing copy. */
const MEDIA_DIR = "media/";
const MEDIA = {
  video_cover:   {file:"video_cover",   what:"Video of a speaker for the title slide (shown without sound)", where:"slide 1"},
  clean:         {file:"clean",         what:"The clean voice alone",                    where:"slide 2"},
  noise:         {file:"noise",         what:"The noise alone",                          where:"slide 2"},
  noisy:         {file:"noisy",         what:"The noisy recording (sound)",              where:"slide 2"},
  video_camera:  {file:"video_camera",  what:"What the camera sees (shown without sound)", where:"slide 4"},
  video_step1:   {file:"video_step1",   what:"The silent video given to the model (shown without sound)", where:"slide 7"},
  voice_step1:   {file:"voice_step1",   what:"The voice generated for that slide 7 video (sound)", where:"slide 7"},
  silent:        {file:"silent",        what:"The silent input video of the real examples", where:"slide 9"},
  random_1:      {file:"random_1",      what:"Speech generated without video, run 1 (sound)", where:"slide 9"},
  random_2:      {file:"random_2",      what:"Speech generated without video, run 2 (sound)", where:"slide 9"},
  synced_1:      {file:"synced_1",      what:"Speech generated from the slide 9 video, run 1 (sound alone, or the video with this sound)", where:"slide 9"},
  synced_2:      {file:"synced_2",      what:"Speech generated from the slide 9 video, run 2 (same)", where:"slide 9"},
  reference:     {file:"reference",     what:"The original recording, as reference: the slide 9 video with its own sound (or that sound alone)", where:"slide 9"},
  enhanced:      {file:"enhanced",      what:"The cleaned voice (sound)",                where:"slide 10"},
  demo_before:   {file:"demo_before",   what:"Before: the noisy recording (video or sound)", where:"slide 11"},
  demo_after:    {file:"demo_after",    what:"After: the enhanced result (video or sound)",  where:"slide 11"},
  picture_voice: {file:"picture_voice", what:"The clean voice of the summary picture (sound)", where:"slide 13"},
  video_picture: {file:"video_picture", what:"Video of the lips for the summary picture (shown without sound)", where:"slide 13"}
};

/* =====================================================================
   2. DRAWING HELPERS
   ===================================================================== */
const C={ink:'#131C2E',bg:'#F2F5F9',card:'#FFFFFF',line:'#D5DCE6',muted:'#5A6578',blue:'#1F5FD0',orange:'#F08A24',rose:'#D1486A',skin:'#FFDDBF',lblue:'#9CC4FF',scene:'#E3E9F2'};
const SEG=[[.04,.30],[.40,.62],[.70,.96]];
const f=x=>+(+x).toFixed(1);
function rng(seed){let s=(seed*2654435761)>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
/* mouth opening at time t (0..1): syllables inside each speaking segment, closed in the pauses */
function opn(t,segs=SEG,ph=0){for(const[s,e]of segs){if(t>=s&&t<=e){const u=(t-s)/(e-s),syl=Math.max(2,Math.round((e-s)*14));return Math.pow(Math.sin(Math.PI*u),.45)*(.3+.7*Math.abs(Math.sin(u*Math.PI*syl+ph)))}}return 0}
function env(n,segs,seed,ph=0){const r=rng(seed),o=[];for(let i=0;i<n;i++){const a=opn((i+.5)/n,segs,ph);o.push(a>0?Math.max(.06,a*(.7+.3*r())):.035)}return o}
function nenv(n,seed,lo=.5){const r=rng(seed),o=[];for(let i=0;i<n;i++)o.push(lo+(1-lo)*r());return o}
function bars(x0,ym,w,hs,col,mh,bwf=.6,op,cls){const p=w/hs.length,bw=p*bwf;return hs.map((h,i)=>{const hh=Math.max(2.5,h*mh);return `<rect${cls?` class="${cls}"`:''} x="${f(x0+i*p+(p-bw)/2)}" y="${f(ym-hh)}" width="${f(bw)}" height="${f(2*hh)}" rx="${f(bw/2)}" fill="${col}"${op?` opacity="${op}"`:''}/>`}).join('')}
function mouth(cx,cy,w,o,talk,mode){const ry=w*(.17+.25*o),iry=Math.max(1.4,w*(.015+.19*o));
  return `<g${talk?` class="talk" data-w="${f(w)}" data-mode="${mode||''}"`:''}><ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(w/2)}" ry="${f(ry)}" fill="${C.rose}"/><ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(w*.36)}" ry="${f(iry)}" fill="#3A1626"/></g>`}
function bust(cx,cy,r,o,{shirt=C.blue,bottom,talk=false,mode=''}={}){const b=bottom??cy+2.3*r;
  let s=`<path d="M ${f(cx-1.25*r)} ${f(b)} Q ${f(cx-1.25*r)} ${f(cy+1.12*r)} ${f(cx)} ${f(cy+1.05*r)} Q ${f(cx+1.25*r)} ${f(cy+1.12*r)} ${f(cx+1.25*r)} ${f(b)} Z" fill="${shirt}"/>`;
  s+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${C.skin}" stroke="${C.ink}" stroke-width="${f(Math.max(2,r/14))}"/>`;
  for(const sx of[-1,1])s+=`<circle cx="${f(cx+sx*.36*r)}" cy="${f(cy-.18*r)}" r="${f(Math.max(1.6,.085*r))}" fill="${C.ink}"/>`;
  return s+mouth(cx,cy+.46*r,.62*r,o,talk,mode)}
function zig(x,y,len,amp,n,angle=0,color=C.orange,sw=5){const pts=[];for(let i=0;i<=n;i++)pts.push(f(x+len*i/n)+','+f(y+((i===0||i===n)?0:(i%2?amp:-amp))));
  return `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" transform="rotate(${angle} ${f(x)} ${f(y)})"/>`}
function arcs(cx,cy,r0,n,dir=0,color=C.blue,sw=5,span=42,step=14){let s='';for(let i=0;i<n;i++){const r=r0+i*step,a1=(dir-span)*Math.PI/180,a2=(dir+span)*Math.PI/180;
  s+=`<path d="M ${f(cx+r*Math.cos(a1))} ${f(cy+r*Math.sin(a1))} A ${f(r)} ${f(r)} 0 0 1 ${f(cx+r*Math.cos(a2))} ${f(cy+r*Math.sin(a2))}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`}return s}
function arrow(x1,y1,x2,y2,color=C.ink,sw=5,head=16){const a=Math.atan2(y2-y1,x2-x1),bx=x2-head*Math.cos(a),by=y2-head*Math.sin(a),px=-Math.sin(a)*head*.6,py=Math.cos(a)*head*.6;
  return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(bx)}" y2="${f(by)}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/><polygon points="${f(x2)},${f(y2)} ${f(bx+px)},${f(by+py)} ${f(bx-px)},${f(by-py)}" fill="${color}"/>`}
function mixColor(c1,c2,t){const a=[1,3,5].map(i=>parseInt(c1.slice(i,i+2),16)),b=[1,3,5].map(i=>parseInt(c2.slice(i,i+2),16));return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')}

function wave({w,h,kind='speech',n,seed=5,segs=SEG,ph=0}){const mh=h/2-6,ym=h/2;n=n||Math.round(w/9.5);let g='';
  if(kind==='speech')g=bars(0,ym,w,env(n,segs,seed,ph),C.blue,mh);
  else if(kind==='light')g=bars(0,ym,w,env(n,segs,seed,ph),C.lblue,mh);
  else if(kind==='noise')g=bars(0,ym,w,nenv(n,seed),C.orange,mh,.72);
  else if(kind==='mixed')g=bars(0,ym,w,nenv(n,seed+7),C.orange,mh,.72)+bars(0,ym,w,env(n,segs,seed,ph).map(v=>v*.8),C.blue,mh,.36);
  else if(kind==='ghost')g=[41,42,43].map((s,i)=>bars(0,ym,w,env(n,segs,s,i*.9),C.blue,mh,.6,.38)).join('');
  return `<svg class="wave" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}</svg>`}
function vid({w=440,slot=null,sm=false,mode='',mute=false,zoom=false}={}){
  const face=zoom
    ?`<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" fill="${C.skin}"/><path d="M 176 62 Q 200 86 224 62" fill="none" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>${mouth(200,178,176,.1,true,mode)}</svg>`

  return `<div class="vid${sm?' sm':''}" style="width:${w}px"><div class="screen"${slot?` data-slot="${slot}" data-ui="screen"`:''}>${face}${slot?'<video muted loop playsinline></video>':''}<span class="vbadge">${ico('play')}</span>${mute?`<span class="vmute">${ico('mute')}</span>`:''}<div class="scrub"><i></i></div></div></div>`}
function film({n=10,h=110,segs=SEG}={}){let t='';for(let i=0;i<n;i++)t+=`<svg viewBox="0 0 80 64" preserveAspectRatio="xMidYMid slice"><rect width="80" height="64" fill="#FFF3E4"/>${bust(40,25,21,opn((i+.5)/n,segs),{bottom:64})}</svg>`;
  return `<div class="film" style="height:${h}px">${t}</div>`}
function chip(slot,label,{mini=false,light=false,sync=''}={}){return `<button class="chip empty${mini?' mini':''}${light?' light':''}" data-slot="${slot}" data-ui="chip" data-label="${label}"${sync?` data-sync="${sync}"`:''}><span class="ico">${ico('mute')}</span>${mini?'':'<span class="lab">Audio unavailable</span>'}</button>`}

const state={},audioEl={};
const isVideoFile=(type,name)=>/^video\//i.test(type||'')||/\.(mp4|m4v|mov|webm|mkv|avi|ogv)$/i.test(name||'');
/* load a file far enough to know whether the browser can play it and whether it can show a picture */
function probeUrl(url,wait=2500){return new Promise(res=>{const v=document.createElement('video');v.preload='auto';v.muted=true;v.playsInline=true;let done=false,meta=false,t2;
  const pic=()=>v.videoWidth>0||!!(v.videoTracks&&v.videoTracks.length);
  const fin=ok=>{if(done)return;done=true;clearTimeout(to);clearTimeout(t2);v.onloadedmetadata=v.onloadeddata=v.onerror=null;const r=ok?{url,hasVideo:pic()}:null;try{v.removeAttribute('src');v.load()}catch(e){}res(r)};
  const to=setTimeout(()=>fin(meta),wait);
  v.onloadedmetadata=()=>{meta=true;if(pic())fin(true);else t2=setTimeout(()=>fin(true),900)};
  v.onloadeddata=()=>fin(true);v.onerror=()=>fin(false);v.src=url})}
function setMedia(key,info){xStop();if(audioEl[key]){audioEl[key].pause();delete audioEl[key]}state[key]=info;refresh(key)}
function refresh(key){const m=state[key];
  document.querySelectorAll(`[data-slot="${key}"]`).forEach(el=>{const ui=el.dataset.ui;
    if(ui==='chip'){el.classList.toggle('empty',!m);el.classList.remove('playing');el.querySelector('.ico').innerHTML=ico(m?'play':'mute');const l=el.querySelector('.lab');if(l)l.textContent=m?el.dataset.label:'Audio unavailable';
      el.disabled=!m;el.title=m?'Play':'Audio unavailable';el.setAttribute('aria-label',m?'Play: '+MEDIA[key].what:'Audio unavailable')}
    else if(ui==='screen'){const v=el.querySelector('video'),ok=m&&m.hasVideo;el.classList.toggle('has',!!ok);if(ok){if(v.dataset.url!==m.url){v.dataset.url=m.url;v.src=m.url}}else{v.removeAttribute('src');delete v.dataset.url}}
    else if(ui==='run'){el.classList.toggle('empty',!m);el.classList.remove('playing');el.querySelector('.ico').innerHTML=ico(m?'play':'mute');el.querySelector('.rp i').style.width='0';
      el.disabled=!m;el.title=m?'Play':'Audio unavailable';el.setAttribute('aria-label',m?'Play: '+MEDIA[key].what:'Audio unavailable')}
    else if(ui==='xscreen'){const v=el.querySelector('video'),ok=!!m&&(m.hasVideo||m.isVideoFile);el.classList.toggle('empty',!ok);el.classList.toggle('nopic',ok&&!m.hasVideo);if(ok&&!xNow){setSrc(v,m.url);v.muted=true;xTag('mute','silent input')}}
    else if(ui==='player'){const v=el.querySelector('video');el.classList.toggle('empty',!m);el.classList.toggle('audio',!!m&&!m.hasVideo);if(m)v.src=m.url;else v.removeAttribute('src')}});
  syncScreens()}
function syncScreens(){document.querySelectorAll('.screen>video').forEach(v=>{if(v.dataset.url&&v.closest('.slide').classList.contains('active'))v.play().catch(()=>{});else v.pause()})}
function stopAll(){xStop();Object.values(audioEl).forEach(a=>a.pause());document.querySelectorAll('.player video').forEach(v=>v.pause())}
function getAudio(key){let a=audioEl[key];if(!a){a=audioEl[key]=new Audio(state[key].url);a.onplay=()=>mark(key,true);a.onpause=a.onended=()=>mark(key,false)}return a}
function setSrc(v,url){if(v.dataset.url!==url){v.dataset.url=url;v.src=url}}
/* real examples: a run is a sound (played over the muted input video) or a video that already carries the generated sound */
let xNow=null;
const xVideo=()=>document.querySelector('.xscreen video');
function xTag(icon,text){const t=document.getElementById('xtag');t.innerHTML=ico(icon)+'<span>'+text+'</span>'}
const xScreen=()=>document.querySelector('.xscreen');
function xOn(on){xScreen().classList.toggle('on',on);document.getElementById('xplay').innerHTML=ico(on?'pause':'play')}
function xStop(){const v=xVideo();if(v)v.pause();if(xNow){xNow.media.pause();const el=xNow.el;el.classList.remove('playing');const ic=el.querySelector('.ico');if(ic)ic.innerHTML=ico('play')}xNow=null;if(xScreen())xOn(false)}
/* the play button on the video: the input video alone, without sound */
function xToggle(){if(xNow){stopAll();return}const m=state.silent;if(!m||!(m.hasVideo||m.isVideoFile))return;stopAll();
  const v=xVideo();setSrc(v,m.url);v.muted=true;try{v.currentTime=0}catch(e){}v.play().catch(()=>{});xTag('mute','silent input');
  document.querySelectorAll('.run .rp i').forEach(i=>i.style.width='0');xNow={key:'silent',media:v,el:xScreen()};xOn(true)}
/* a run: its sound over the muted input video, or its own video if the file is one */
function playRun(el){const key=el.dataset.slot,m=state[key];if(!m)return;
  const was=el.classList.contains('playing');stopAll();if(was)return;
  const v=xVideo();let media,onScreen=false;
  if(el.dataset.with){const sil=state.silent;
    if(m.hasVideo){setSrc(v,m.url);v.muted=false;media=v;onScreen=true}
    else{if(sil&&(sil.hasVideo||sil.isVideoFile)){setSrc(v,sil.url);v.muted=true;try{v.currentTime=0}catch(e){}v.play().catch(()=>{});onScreen=true}media=getAudio(key)}
    xTag('audio',el.dataset.label)
  }else media=getAudio(key);
  try{media.currentTime=0}catch(e){}media.play().catch(()=>{});
  document.querySelectorAll('.run .rp i').forEach(i=>i.style.width='0');
  xNow={key,media,el};el.classList.add('playing');el.querySelector('.ico').innerHTML=ico('pause');if(onScreen)xOn(true)}
(()=>{const v=xVideo();if(!v)return;
  const check=()=>{const m=state.silent;if(v.videoWidth>0){xScreen().classList.remove('nopic');if(m&&m.url===v.dataset.url&&!m.hasVideo){m.hasVideo=true;m.unplayable=false;}}
    if(v.paused&&v.currentTime===0&&v.readyState>=1){try{v.currentTime=0.01}catch(e){}}};
  v.addEventListener('loadedmetadata',check);v.addEventListener('loadeddata',check);v.addEventListener('resize',check)})();
setInterval(()=>{const v=xVideo(),xb=document.getElementById('xbar');if(v&&xb&&v.duration&&xScreen().classList.contains('on'))xb.style.width=(v.currentTime/v.duration*100)+'%';
  if(!xNow)return;const md=xNow.media,bar=xNow.el.querySelector('.rp i');

Object.keys(MEDIA).forEach(k=>{refresh(k);
