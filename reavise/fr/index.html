<style>

.xscreen.nopic .xplay,.xscreen.nopic .xbar{display:none}

.rhead{font-family:var(--hand);font-weight:600;font-size:40px;line-height:1;color:var(--muted)}

.novid{height:150px;flex:none}

.run.alt{border-color:var(--blue)}

const C={ink:'#131C2E',bg:'#F2F5F9',card:'#FFFFFF',line:'#D5DCE6',muted:'#5A6578',blue:'#1F5FD0',orange:'#F08A24',rose:'#D1486A',skin:'#FFDDBF',lblue:'#9CC4FF',scene:'#E3E9F2'};
const SEG=[[.04,.30],[.40,.62],[.70,.96]];
const f=x=>+(+x).toFixed(1);
function rng(seed){let s=(seed*2654435761)>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
/* mouth opening at time t (0..1): syllables inside each speaking segment, closed in the pauses */
function opn(t,segs=SEG,ph=0){for(const[s,e]of segs){if(t>=s&&t<=e){const u=(t-s)/(e-s),syl=Math.max(2,Math.round((e-s)*14));return Math.pow(Math.sin(Math.PI*u),.45)*(.3+.7*Math.abs(Math.sin(u*Math.PI*syl+ph)))}}return 0}
function env(n,segs,seed,ph=0){const r=rng(seed),o=[];for(let i=0;i<n;i++){const a=opn((i+.5)/n,segs,ph);o.push(a>0?Math.max(.06,a*(.7+.3*r())):.035)}return o}
function nenv(n,seed,lo=.5){const r=rng(seed),o=[];for(let i=0;i<n;i++)o.push(lo+(1-lo)*r());return o}
function bars(x0,ym,w,hs,col,mh,bwf=.6,op,cls){const p=w/hs.length,bw=p*bwf;return hs.map((h,i)=>{const hh=Math.max(2.5,h*mh);return `<rect${cls?` class="${cls}"`:''} x="${f(x0+i*p+(p-bw)/2)}" y="${f(ym-hh)}" width="${f(bw)}" height="${f(2*hh)}" rx="${f(bw/2)}" fill="${col}"${op?` opacity="${op}"`:''}/>`}).join('')}
function mouth(cx,cy,w,o,talk,mode){const ry=w*(.17+.25*o),iry=Math.max(1.4,w*(.015+.19*o));
  return `<g${talk?` class="talk" data-w="${f(w)}" data-mode="${mode||''}"`:''}><ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(w/2)}" ry="${f(ry)}" fill="${C.rose}"/><ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(w*.36)}" ry="${f(iry)}" fill="#3A1626"/></g>`}
function bust(cx,cy,r,o,{shirt=C.blue,bottom,talk=false,mode=''}={}){const b=bottom??cy+2.3*r;
  let s=`<path d="M ${f(cx-1.25*r)} ${f(b)} Q ${f(cx-1.25*r)} ${f(cy+1.12*r)} ${f(cx)} ${f(cy+1.05*r)} Q ${f(cx+1.25*r)} ${f(cy+1.12*r)} ${f(cx+1.25*r)} ${f(b)} Z" fill="${shirt}"/>`;
  s+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${C.skin}" stroke="${C.ink}" stroke-width="${f(Math.max(2,r/14))}"/>`;
  for(const sx of[-1,1])s+=`<circle cx="${f(cx+sx*.36*r)}" cy="${f(cy-.18*r)}" r="${f(Math.max(1.6,.085*r))}" fill="${C.ink}"/>`;
  return s+mouth(cx,cy+.46*r,.62*r,o,talk,mode)}
function zig(x,y,len,amp,n,angle=0,color=C.orange,sw=5){const pts=[];for(let i=0;i<=n;i++)pts.push(f(x+len*i/n)+','+f(y+((i===0||i===n)?0:(i%2?amp:-amp))));
  return `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" transform="rotate(${angle} ${f(x)} ${f(y)})"/>`}
function arcs(cx,cy,r0,n,dir=0,color=C.blue,sw=5,span=42,step=14){let s='';for(let i=0;i<n;i++){const r=r0+i*step,a1=(dir-span)*Math.PI/180,a2=(dir+span)*Math.PI/180;
  s+=`<path d="M ${f(cx+r*Math.cos(a1))} ${f(cy+r*Math.sin(a1))} A ${f(r)} ${f(r)} 0 0 1 ${f(cx+r*Math.cos(a2))} ${f(cy+r*Math.sin(a2))}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`}return s}
function arrow(x1,y1,x2,y2,color=C.ink,sw=5,head=16){const a=Math.atan2(y2-y1,x2-x1),bx=x2-head*Math.cos(a),by=y2-head*Math.sin(a),px=-Math.sin(a)*head*.6,py=Math.cos(a)*head*.6;
  return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(bx)}" y2="${f(by)}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/><polygon points="${f(x2)},${f(y2)} ${f(bx+px)},${f(by+py)} ${f(bx-px)},${f(by-py)}" fill="${color}"/>`}
function mixColor(c1,c2,t){const a=[1,3,5].map(i=>parseInt(c1.slice(i,i+2),16)),b=[1,3,5].map(i=>parseInt(c2.slice(i,i+2),16));return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')}

/* ---------- components */
function wave({w,h,kind='speech',n,seed=5,segs=SEG,ph=0}){const mh=h/2-6,ym=h/2;n=n||Math.round(w/9.5);let g='';
  if(kind==='speech')g=bars(0,ym,w,env(n,segs,seed,ph),C.blue,mh);
  else if(kind==='light')g=bars(0,ym,w,env(n,segs,seed,ph),C.lblue,mh);
  else if(kind==='noise')g=bars(0,ym,w,nenv(n,seed),C.orange,mh,.72);
  else if(kind==='mixed')g=bars(0,ym,w,nenv(n,seed+7),C.orange,mh,.72)+bars(0,ym,w,env(n,segs,seed,ph).map(v=>v*.8),C.blue,mh,.36);
  else if(kind==='ghost')g=[41,42,43].map((s,i)=>bars(0,ym,w,env(n,segs,s,i*.9),C.blue,mh,.6,.38)).join('');
  return `<svg class="wave" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}</svg>`}
function vid({w=440,slot=null,sm=false,mode='',mute=false,zoom=false}={}){
  const face=zoom
    ?`<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" fill="${C.skin}"/><path d="M 176 62 Q 200 86 224 62" fill="none" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>${mouth(200,178,176,.1,true,mode)}</svg>`
    :`<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" fill="#FFF3E4"/><circle cx="345" cy="50" r="95" fill="#FFE7CD"/>${bust(200,128,74,.5,{bottom:300,talk:true,mode})}</svg>`;
  return `<div class="vid${sm?' sm':''}" style="width:${w}px"><div class="screen"${slot?` data-slot="${slot}" data-ui="screen"`:''}>${face}${slot?'<video muted loop playsinline></video>':''}<span class="vbadge">${ico('play')}</span>${mute?`<span class="vmute">${ico('mute')}</span>`:''}<div class="scrub"><i></i></div>${slot?`<button class="vadd" data-pick="${slot}" title="Mettre votre propre vidéo ici">${ico('plus')}</button>`:''}</div></div>`}
function film({n=10,h=110,segs=SEG}={}){let t='';for(let i=0;i<n;i++)t+=`<svg viewBox="0 0 80 64" preserveAspectRatio="xMidYMid slice"><rect width="80" height="64" fill="#FFF3E4"/>${bust(40,25,21,opn((i+.5)/n,segs),{bottom:64})}</svg>`;
  return `<div class="film" style="height:${h}px">${t}</div>`}
function chip(slot,label,{mini=false,light=false,sync=''}={}){return `<button class="chip empty${mini?' mini':''}${light?' light':''}" data-slot="${slot}" data-ui="chip" data-label="${label}"${sync?` data-sync="${sync}"`:''}><span class="ico">${ico('plus')}</span>${mini?'':'<span class="lab">ajouter un son</span>'}</button>`}
function player(slot,kind){return `<div class="player empty" data-slot="${slot}" data-ui="player"><div class="pwave">${wave({w:760,h:280,kind,n:70})}</div><video controls playsinline preload="metadata"></video><div class="drop" data-pick="${slot}"><span class="dico">${ico('video')}</span><b>Déposez une vidéo ou un son ici</b><span>ou cliquez pour choisir un fichier, ou enregistrez-le sous <code>${MEDIA_DIR}${MEDIA[slot].file}.mp4</code></span></div></div>`}
const lab=k=>`<span class="tico">${ico(k)}</span>`;
function tl(rows,{bands='',playhead=true,gap=12}={}){
  return `<div class="tl"><div class="tll" style="gap:${gap}px">${rows.map(r=>`<div class="tlc" style="height:${r.h}px">${r.label}</div>`).join('')}</div><div class="tlt" style="gap:${gap}px">${bands}${rows.map(r=>`<div class="tlr" style="height:${r.h}px">${r.track}</div>`).join('')}${playhead?'<div class="playhead"></div>':''}</div></div>`}

function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}

  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===cur));document.getElementById('count').textContent=(cur+1)+' / '+els.length;
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}stopAll();syncScreens()}

addEventListener('keydown',e=>{const t=e.target;
  if(t.matches&&t.matches('input[type=range]')&&e.key.startsWith('Arrow'))return;
  if(t.matches&&t.matches('button,video')&&(e.key===' '||e.key==='Enter'))return;

  else if(e.key==='Home')go(0);else if(e.key==='End')go(els.length-1);
  else if(e.key==='f'||e.key==='F')fullscreen();else if(e.key==='m'||e.key==='M')togglePanel()});

function knobDraw(){const w=knob.value/100,wt=Math.min(1,w*1.7),leak=Math.pow(Math.max(0,(w-.5)*2),1.3)*.85;
  oS.forEach((el,i)=>{const hh=Math.max(2.5,(wt*oTrue[i]+(1-wt)*oAlt[i])*100);el.setAttribute('y',110-hh);el.setAttribute('height',2*hh)});

  s.querySelectorAll('.playhead').forEach(p=>p.style.left=(T*100)+'%');
  s.querySelectorAll('.scrub i').forEach(p=>p.style.width=(T*100)+'%');
  if(s.id==='s-cover')coverTick(still?5000:now);else if(s.id==='s-step1')diffTick(still?5000:now);
  if(!still)requestAnimationFrame(tick)}
requestAnimationFrame(tick);

/* =====================================================================
   5. MEDIA: find the files, play them, let you pick others
   ===================================================================== */
const state={},audioEl={};let pickKey=null;
const isVideoFile=(type,name)=>/^video\//i.test(type||'')||/\.(mp4|m4v|mov|webm|mkv|avi|ogv)$/i.test(name||'');
/* load a file far enough to know whether the browser can play it and whether it can show a picture */
function probeUrl(url,wait=2500){return new Promise(res=>{const v=document.createElement('video');v.preload='auto';v.muted=true;v.playsInline=true;let done=false,meta=false,t2;
  const pic=()=>v.videoWidth>0||!!(v.videoTracks&&v.videoTracks.length);
  const fin=ok=>{if(done)return;done=true;clearTimeout(to);clearTimeout(t2);v.onloadedmetadata=v.onloadeddata=v.onerror=null;const r=ok?{url,hasVideo:pic()}:null;try{v.removeAttribute('src');v.load()}catch(e){}res(r)};
  const to=setTimeout(()=>fin(meta),wait);
  v.onloadedmetadata=()=>{meta=true;if(pic())fin(true);else t2=setTimeout(()=>fin(true),900)};
  v.onloadeddata=()=>fin(true);v.onerror=()=>fin(false);v.src=url})}
async function probe(key){const b=MEDIA[key].file,c=/\.[a-z0-9]+$/i.test(b)?[b]:EXT.map(e=>b+'.'+e);
  for(const name of c){const r=await probeUrl(MEDIA_DIR+name);if(r){r.name=MEDIA_DIR+name;r.isVideoFile=isVideoFile('',name);return r}}return null}
function setMedia(key,info){xStop();if(audioEl[key]){audioEl[key].pause();delete audioEl[key]}state[key]=info;refresh(key)}
function refresh(key){const m=state[key];
  document.querySelectorAll(`[data-slot="${key}"]`).forEach(el=>{const ui=el.dataset.ui;
    if(ui==='chip'){el.classList.toggle('empty',!m);el.classList.remove('playing');el.querySelector('.ico').innerHTML=ico(m?'play':'plus');const l=el.querySelector('.lab');if(l)l.textContent=m?el.dataset.label:'ajouter un son';
      el.title=m?'Lire':`Choisissez un fichier son ou vidéo, ou enregistrez-le sous ${MEDIA_DIR}${MEDIA[key].file}.wav`;el.setAttribute('aria-label',m?'Lire : '+MEDIA[key].what:'Ajouter un fichier : '+MEDIA[key].what)}
    else if(ui==='screen'){const v=el.querySelector('video'),ok=m&&m.hasVideo;el.classList.toggle('has',!!ok);if(ok){if(v.dataset.url!==m.url){v.dataset.url=m.url;v.src=m.url}}else{v.removeAttribute('src');delete v.dataset.url}}
    else if(ui==='run'){el.classList.toggle('empty',!m);el.classList.remove('playing');el.querySelector('.ico').innerHTML=ico(m?'play':'plus');el.querySelector('.rp i').style.width='0';
      el.title=m?'Lire':`Choisissez un fichier, déposez-le ici, ou enregistrez-le sous ${MEDIA_DIR}${MEDIA[key].file}.wav (ou .mp4)`;el.setAttribute('aria-label',(m?'Lire : ':'Ajouter un fichier : ')+MEDIA[key].what)}
    else if(ui==='xscreen'){const v=el.querySelector('video'),ok=!!m&&(m.hasVideo||m.isVideoFile);el.classList.toggle('empty',!ok);el.classList.toggle('nopic',ok&&!m.hasVideo);if(ok&&!xNow){setSrc(v,m.url);v.muted=true;xTag('mute','entrée muette')}}
    else if(ui==='player'){const v=el.querySelector('video');el.classList.toggle('empty',!m);el.classList.toggle('audio',!!m&&!m.hasVideo);if(m)v.src=m.url;else v.removeAttribute('src')}});
  drawPanel();syncScreens()}
function syncScreens(){document.querySelectorAll('.screen>video').forEach(v=>{if(v.dataset.url&&v.closest('.slide').classList.contains('active'))v.play().catch(()=>{});else v.pause()})}
function stopAll(){xStop();Object.values(audioEl).forEach(a=>a.pause());document.querySelectorAll('.player video').forEach(v=>v.pause())}
function getAudio(key){let a=audioEl[key];if(!a){a=audioEl[key]=new Audio(state[key].url);a.onplay=()=>mark(key,true);a.onpause=a.onended=()=>mark(key,false)}return a}
function setSrc(v,url){if(v.dataset.url!==url){v.dataset.url=url;v.src=url}}
/* real examples: a run is a sound (played over the muted input video) or a video that already carries the generated sound */
let xNow=null;
const xVideo=()=>document.querySelector('.xscreen video');
function xTag(icon,text){const t=document.getElementById('xtag');t.innerHTML=ico(icon)+'<span>'+text+'</span>'}
const xScreen=()=>document.querySelector('.xscreen');
function xOn(on){xScreen().classList.toggle('on',on);document.getElementById('xplay').innerHTML=ico(on?'pause':'play')}
function xStop(){const v=xVideo();if(v)v.pause();if(xNow){xNow.media.pause();const el=xNow.el;el.classList.remove('playing');const ic=el.querySelector('.ico');if(ic)ic.innerHTML=ico('play')}xNow=null;if(xScreen())xOn(false)}
/* the play button on the video: the input video alone, without sound */
function xToggle(){if(xNow){stopAll();return}const m=state.silent;if(!m||!(m.hasVideo||m.isVideoFile))return;stopAll();
  const v=xVideo();setSrc(v,m.url);v.muted=true;try{v.currentTime=0}catch(e){}v.play().catch(()=>{});xTag('mute','entrée muette');
  document.querySelectorAll('.run .rp i').forEach(i=>i.style.width='0');xNow={key:'silent',media:v,el:xScreen()};xOn(true)}
/* a run: its sound over the muted input video, or its own video if the file is one */
function playRun(el){const key=el.dataset.slot,m=state[key];if(!m){pick(key);return}
  const was=el.classList.contains('playing');stopAll();if(was)return;
  const v=xVideo();let media,onScreen=false;
  if(el.dataset.with){const sil=state.silent;
    if(m.hasVideo){setSrc(v,m.url);v.muted=false;media=v;onScreen=true}
    else{if(sil&&(sil.hasVideo||sil.isVideoFile)){setSrc(v,sil.url);v.muted=true;try{v.currentTime=0}catch(e){}v.play().catch(()=>{});onScreen=true}media=getAudio(key)}
    xTag('audio',el.dataset.label)
  }else media=getAudio(key);
  try{media.currentTime=0}catch(e){}media.play().catch(()=>{});
  document.querySelectorAll('.run .rp i').forEach(i=>i.style.width='0');
  xNow={key,media,el};el.classList.add('playing');el.querySelector('.ico').innerHTML=ico('pause');if(onScreen)xOn(true)}
(()=>{const v=xVideo();if(!v)return;
  const check=()=>{const m=state.silent;if(v.videoWidth>0){xScreen().classList.remove('nopic');if(m&&m.url===v.dataset.url&&!m.hasVideo){m.hasVideo=true;m.unplayable=false;drawPanel()}}
    if(v.paused&&v.currentTime===0&&v.readyState>=1){try{v.currentTime=0.01}catch(e){}}};
  v.addEventListener('loadedmetadata',check);v.addEventListener('loadeddata',check);v.addEventListener('resize',check)})();
setInterval(()=>{const v=xVideo(),xb=document.getElementById('xbar');if(v&&xb&&v.duration&&xScreen().classList.contains('on'))xb.style.width=(v.currentTime/v.duration*100)+'%';
  if(!xNow)return;const md=xNow.media,bar=xNow.el.querySelector('.rp i');
  if(md.ended){if(bar)bar.style.width='100%';xStop();return}
  if(bar&&md.duration)bar.style.width=(md.currentTime/md.duration*100)+'%'},80);
function mark(key,on){document.querySelectorAll(`[data-slot="${key}"][data-ui="chip"]`).forEach(c=>{c.classList.toggle('playing',on);c.querySelector('.ico').innerHTML=ico(on?'pause':'play')})}
function toggle(key,chipEl){const m=state[key];if(!m){pick(key);return}
  const a=getAudio(key);
  if(a.paused){stopAll();a.currentTime=0;const sv=chipEl&&chipEl.dataset.sync&&document.querySelector(`.slide.active .screen[data-slot="${chipEl.dataset.sync}"].has video`);if(sv){try{sv.currentTime=0}catch(e){}sv.play().catch(()=>{})}a.play().catch(()=>{})}else a.pause()}
function pick(key){pickKey=key;const fi=document.getElementById('file');fi.value='';fi.click()}
async function useFile(key,file,name,src='picked'){if(!file||!MEDIA[key])return;const url=URL.createObjectURL(file),nm=name||file.name||key;const r=await probeUrl(url,8000);
  const info={url,hasVideo:!!(r&&r.hasVideo),isVideoFile:isVideoFile(file.type,nm),unplayable:!r,name:nm,blob:file,src};
  setMedia(key,info);if(src==='picked'){dirty=true;saveState(info.isVideoFile&&!info.hasVideo?noPicture(nm):(!info.isVideoFile&&VIDEO_ONLY.includes(key)?`${nm} est un fichier son ; il faut une vidéo ici.`:''))}}
const VIDEO_ONLY=['silent','video_cover','video_camera','video_step1','video_picture'];
const noPicture=nm=>`Ce navigateur ne peut pas afficher l’image de ${nm}. Convertissez-la en H.264 (yuv420p), puis choisissez-la de nouveau.`;
/* ---------- keep the chosen files: download a copy of this page with them stored inside */
let dirty=false;
function saveState(text){const b=document.getElementById('bSave');b.classList.toggle('dirty',dirty);document.getElementById('ui').classList.toggle('attn',dirty);
  document.getElementById('saveMsg').textContent=text||(dirty?'Fichiers choisis, pas encore enregistrés':'');drawPanel()}
const readData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('lecture d’un fichier impossible'));r.readAsDataURL(b)});
function dataToBlob(d){const i=d.indexOf(','),mime=d.slice(5,i).replace(';base64',''),bin=atob(d.slice(i+1)),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime})}
async function saveCopy(){const btn=document.getElementById('bSave');btn.disabled=true;saveState('Préparation de la copie…');
  try{const out={};let n=0,bytes=0,left=0;
    for(const[k,m]of Object.entries(state)){if(!m)continue;let b=m.blob;
      if(!b){try{b=await(await fetch(m.url)).blob()}catch(e){b=null}}
      if(b){out[k]={n:m.name||k,d:await readData(b)};n++;bytes+=b.size}else left++}
    const A='/*EMBED-'+'START*/',B='/*EMBED-'+'END*/',i=PRISTINE.indexOf(A),j=PRISTINE.indexOf(B,i);
    if(i<0||j<0)throw new Error('cette page a été modifiée et ne peut pas contenir de fichiers');
    const page=new Blob([PRISTINE.slice(0,i),A,'const EMBED=',JSON.stringify(out),';',PRISTINE.slice(j)],{type:'text/html'});
    let name=decodeURIComponent(location.pathname.split('/').pop()||'')||'reavise-intro.html';if(!/\.html?$/i.test(name))name='reavise-intro.html';
    if(!/-with-media\.html?$/i.test(name))name=name.replace(/\.html?$/i,'-with-media.html');
    const a=document.createElement('a');a.href=URL.createObjectURL(page);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),120000);
    for(const m of Object.values(state))if(m&&m.src==='picked')m.src='saved';
    dirty=false;saveState(`${name} téléchargé, avec ${n} fichier${n===1?'':'s'} à l’intérieur (${(bytes/1048576).toFixed(1)} Mo). Ouvrez cette copie la prochaine fois.`+(left?` ${left} fichier${left===1?'':'s'} du dossier media n’a pas pu être copié et a encore besoin de ce dossier.`:''))}
  catch(e){saveState('Enregistrement impossible : '+e.message)}
  btn.disabled=false}
document.getElementById('bSave').onclick=saveCopy;
/* bring in the files stored in an earlier saved copy of this deck */
async function importCopy(file){if(!file)return;saveState('Lecture de '+file.name+'…');
  const t=await file.text(),A='/*EMBED-'+'START*/const EMBED=',B=';/*EMBED-'+'END*/',i=t.indexOf(A),j=t.indexOf(B,i);let data=null;
  if(i>=0&&j>=0){try{data=JSON.parse(t.slice(i+A.length,j))}catch(e){}}
  if(!data||!Object.keys(data).length){saveState('Aucun fichier trouvé dans '+file.name+'.');return}
  const old=!t.includes('demo_before:');let n=0;
  for(const[k,e]of Object.entries(data)){let key=k,blob;try{blob=dataToBlob(e.d)}catch(err){continue}
    if(old&&isVideoFile(blob.type,e.n)){if(k==='noisy')key='demo_before';else if(k==='enhanced')key='demo_after'}
    if(MEDIA[key]){await useFile(key,blob,e.n,'picked');n++}}
  saveState(n?`${n} fichier${n===1?'':'s'} récupéré${n===1?'':'s'} depuis ${file.name}. Cliquez sur « Enregistrer une copie avec mes fichiers » pour les garder dans cette version.`:'Aucun fichier correspondant trouvé dans '+file.name+'.')}
document.getElementById('imp').onchange=e=>{importCopy(e.target.files[0]);e.target.value=''};
document.getElementById('file').onchange=e=>useFile(pickKey,e.target.files[0]);
document.addEventListener('click',e=>{const p=e.target.closest('[data-pick]');if(p){e.stopPropagation();pick(p.dataset.pick);return}
  const xs=e.target.closest('.xscreen');if(xs&&!xs.classList.contains('empty')){xToggle();return}
  const r=e.target.closest('.run');if(r){playRun(r);return}
  const c=e.target.closest('.chip');if(c)toggle(c.dataset.slot,c)});
document.addEventListener('play',e=>{if(e.target.matches&&e.target.matches('.player video'))Object.values(audioEl).forEach(a=>a.pause())},true);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const t=e.target.closest&&e.target.closest('[data-slot],[data-pick]');if(t)useFile(t.dataset.slot||t.dataset.pick,e.dataTransfer.files[0])});

const panel=document.getElementById('panel');
function drawPanel(){panel.firstElementChild.innerHTML=`<h3>Fichiers son et vidéo</h3>
<p>Créez un dossier nommé <code>media</code> à côté de ce fichier HTML et enregistrez-y vos fichiers sous ces noms. Extensions acceptées : ${EXT.map(e=>'.'+e).join(' ')}. </p><p style="margin-top:8px"><b>Ou gardez-les dans la page :</b> choisissez les fichiers ici ou déposez-les sur les diapositives, puis cliquez sur <button onclick="saveCopy()">Enregistrer une copie avec mes fichiers</button>. Un nouveau fichier HTML est téléchargé avec ces fichiers à l’intérieur ; ouvrez ensuite cette copie. Sans cette étape, les fichiers choisis sont perdus à la fermeture de la page. De grosses vidéos donnent un gros fichier.</p>
<table><tr><th>Fichier à enregistrer</th><th>Contenu</th><th>Utilisé sur</th><th>État</th><th></th></tr>${Object.entries(MEDIA).map(([k,m])=>`<tr><td><code>${MEDIA_DIR}${m.file}</code></td><td>${m.what}</td><td>${m.where}</td><td class="${state[k]&&!(state[k].isVideoFile&&!state[k].hasVideo)?'ok':'no'}">${!state[k]?'absent':(state[k].src==='saved'?'contenu dans cette page':state[k].src==='picked'?'choisi, pas encore enregistré':'trouvé dans le dossier media')+(state[k].isVideoFile&&!state[k].hasVideo?' : le navigateur ne peut pas afficher son image':'')}</td><td><button data-pick="${k}">Choisir un fichier</button></td></tr>`).join('')}</table>
<p style="margin-top:14px"><b>Vous venez d’une version précédente ?</b> <button onclick="document.getElementById('imp').click()">Récupérer les fichiers d’une copie enregistrée</button> Choisissez votre ancien fichier <code>…-with-media.html</code> (la version anglaise fonctionne aussi) ; ses fichiers sont placés aux bons endroits ici.</p>
<p style="margin-top:14px">Touches : flèches pour avancer, F pour le plein écran, M pour ouvrir ou fermer cette liste. <button onclick="document.getElementById('panel').hidden=true">Fermer</button></p>`}
function togglePanel(){panel.hidden=!panel.hidden}
panel.addEventListener('click',e=>{if(e.target===panel)panel.hidden=true});
drawPanel();
Object.keys(MEDIA).forEach(k=>{refresh(k);
  if(EMBED[k]){try{useFile(k,dataToBlob(EMBED[k].d),EMBED[k].n,'saved')}catch(e){}}
  else if(MEDIA_FILES[k]){const url=MEDIA_DIR+MEDIA_FILES[k];probeUrl(url).then(r=>{if(r&&!state[k]){r.name=url;r.isVideoFile=isVideoFile('',url);r.src='folder';setMedia(k,r)}})}});
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script></body></html>
